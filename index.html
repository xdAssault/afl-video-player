<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>AFL Video Player</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
}

body {
    overflow: hidden;
}

/* =========================
   PLAYER
========================= */

#player {
    width: 100%;
    max-width: 1100px;
    margin: auto;
    background: #000;
}

#videoWrap {
    width: 100%;
    background: #000;
    position: relative;
}

video {
    display: block;
    width: 100%;
    height: auto;
    background: #000;
    object-fit: contain;
}

/* =========================
   NORMAL CONTROLS
========================= */

#controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px;
    background: #111;
}

button {
    border: none;
    border-radius: 8px;
    padding: 11px 15px;
    background: #292929;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(.96);
}

button.active {
    background: #e31b23;
}

#fullscreenBtn {
    margin-left: auto;
    font-size: 20px;
    background: #333;
}

#openFullscreenBtn {
    width: 100%;
    background: #e31b23;
    font-size: 16px;
    padding: 14px;
}

#message {
    text-align: center;
    padding: 8px;
    background: #111;
    color: #aaa;
    font-size: 12px;
}


/* =========================
   STANDALONE MODE
========================= */

body.standalone {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #000;
}

body.standalone #player {
    width: 100vw;
    height: 100vh;
    max-width: none;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
}

body.standalone #videoWrap {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

body.standalone video {
    width: 100vw;
    height: 100vh;
    object-fit: contain;
}

/* Hide ALL custom controls in standalone mode */

body.standalone #controls {
    display: none;
}

body.standalone #message {
    display: none;
}


/* =========================
   TRUE FULLSCREEN
========================= */

#player:fullscreen,
#player:-webkit-full-screen {

    width: 100vw;
    height: 100vh;
    max-width: none;

    background: #000;

    display: flex;
    align-items: center;
    justify-content: center;

}

#player:fullscreen #videoWrap,
#player:-webkit-full-screen #videoWrap {

    width: 100vw;
    height: 100vh;

}

#player:fullscreen video,
#player:-webkit-full-screen video {

    width: 100vw;
    height: 100vh;

    object-fit: contain;

}

#player:fullscreen #controls,
#player:-webkit-full-screen #controls {

    position: absolute;

    bottom: 0;
    left: 0;
    right: 0;

    z-index: 20;

    background: rgba(0,0,0,.75);

}

#player:fullscreen #message,
#player:-webkit-full-screen #message {

    display: none;

}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    button {
        font-size: 14px;
        padding: 10px 13px;
    }

    #controls {
        gap: 6px;
        padding: 8px;
    }

}

</style>
</head>


<body>

<div id="player">

    <div id="videoWrap">

        <video
            id="vid"
            controls
            playsinline
            webkit-playsinline
            preload="metadata">
        </video>

    </div>


    <div id="controls">

        <button
            id="q1"
            onclick="go(0)">
            Q1
        </button>

        <button
            id="q2"
            onclick="go(1)">
            Q2
        </button>

        <button
            id="q3"
            onclick="go(2)">
            Q3
        </button>

        <button
            id="q4"
            onclick="go(3)">
            Q4
        </button>


        <button
            id="fullscreenBtn"
            onclick="fullscreenPlayer()">
            ⛶
        </button>


        <button
            id="openFullscreenBtn"
            onclick="openFullscreenPlayer()">
            📱 Fullscreen Video
        </button>

    </div>


    <div id="message">
        Choose Q1–Q4, then tap 📱 Fullscreen Video
    </div>

</div>


<script>

/* ==========================================
   Q1–Q4 VIDEO LINKS
========================================== */

const streams = [

    // Q1
    "https://afl-vod-multi-005-uptls.akamaized.net/packaging3_f7d8f/out/v1/f552906434954ad5bdadf12380d35c4e/ef1d806899ce413791eb3795aa40401b/b4a356d5797943a38e2db18bf7d1a781/7041471b658e4b4780b70781edde0e32/dc70ac4f15c64664acf501ef0c2c4681/index_2.m3u8",

    // Q2
    "https://afl-vod-multi-005-uptls.akamaized.net/packaging3_f7d8f/out/v1/07c89172716f42c8bda3f6f8ee150e10/ef1d806899ce413791eb3795aa40401b/b4a356d5797943a38e2db18bf7d1a781/713c3a8b292c4c4088a27a3f38948e93/dc70ac4f15c64664acf501ef0c2c4681/index_2.m3u8",

    // Q3
    "https://afl-vod-multi-005-uptls.akamaized.net/packaging3_f7d8f/out/v1/63dfc643ac1d40878097e73abf1d6734/ef1d806899ce413791eb3795aa40401b/b4a356d5797943a38e2db18bf7d1a781/25cd9021cb0e4d0a8ffbc4ee405ac4db/dc70ac4f15c64664acf501ef0c2c4681/index_2.m3u8",

    // Q4
    "https://afl-vod-multi-005-uptls.akamaized.net/packaging3_f7d8f/out/v1/642654a2922a4f1e82b478f8a082d3d1/ef1d806899ce413791eb3795aa40401b/b4a356d5797943a38e2db18bf7d1a781/177f893fee0140069a51c33c82a328ea/dc70ac4f15c64664acf501ef0c2c4681/index_2.m3u8"

];


const video =
    document.getElementById("vid");

const player =
    document.getElementById("player");

const message =
    document.getElementById("message");


/* ==========================================
   CHANGE QUARTER
========================================== */

function go(index) {

    video.pause();

    video.src = streams[index];

    video.load();

    updateButtons(index);

    video.play().catch(() => {

        message.textContent =
            "Tap Play to start the video.";

    });

}


/* ==========================================
   HIGHLIGHT BUTTON
========================================== */

function updateButtons(index) {

    for (let i = 1; i <= 4; i++) {

        document
            .getElementById("q" + i)
            .classList.remove("active");

    }

    document
        .getElementById("q" + (index + 1))
        .classList.add("active");

}


/* ==========================================
   NORMAL FULLSCREEN
========================================== */

async function fullscreenPlayer() {

    try {

        if (document.fullscreenElement) {

            await document.exitFullscreen();
            return;

        }

        if (player.requestFullscreen) {

            await player.requestFullscreen({
                navigationUI: "hide"
            });

            return;

        }

    } catch (error) {

        console.log(
            "Fullscreen blocked:",
            error
        );

    }


    /* WebKit */

    try {

        if (player.webkitRequestFullscreen) {

            player.webkitRequestFullscreen();
            return;

        }

    } catch (error) {

        console.log(error);

    }


    /* Video fullscreen */

    try {

        if (video.webkitEnterFullscreen) {

            video.webkitEnterFullscreen();
            return;

        }

    } catch (error) {

        console.log(error);

    }


    openFullscreenPlayer();

}


/* ==========================================
   GOOGLE SITES → STANDALONE PLAYER
========================================== */

function openFullscreenPlayer() {

    let url =
        window.location.href;


    /*
       Remove an existing fullscreen parameter
       so we don't create ?fullscreen=1&fullscreen=1
    */

    url =
        url.replace(
            /[?&]fullscreen=1/g,
            ""
        );


    /*
       Tell the standalone page to enter
       video-only mode.
    */

    const separator =
        url.includes("?")
        ? "&"
        : "?";


    url =
        url +
        separator +
        "fullscreen=1";


    /*
       Open outside Google Sites.
    */

    const newWindow =
        window.open(
            url,
            "_blank"
        );


    if (!newWindow) {

        message.textContent =
            "Popup blocked. Open the GitHub Pages URL directly.";

    }

}


/* ==========================================
   ENABLE STANDALONE MODE
========================================== */

function checkStandaloneMode() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    if (
        params.get("fullscreen") === "1"
    ) {

        /*
           Hide Q1-Q4 and custom buttons.
           Keep ONLY video + native video controls.
        */

        document.body
            .classList.add("standalone");


        /*
           Give the video maximum screen size.
        */

        video.style.width = "100vw";
        video.style.height = "100vh";
        video.style.objectFit = "contain";


        /*
           Try browser fullscreen.

           Android may reject automatic fullscreen
           because it requires a user gesture.
        */

        setTimeout(() => {

            try {

                if (
                    document.documentElement
                        .requestFullscreen
                ) {

                    document.documentElement
                        .requestFullscreen({
                            navigationUI: "hide"
                        })
                        .catch(() => {

                            console.log(
                                "Tap the video fullscreen control."
                            );

                        });

                }

            } catch (error) {

                console.log(error);

            }

        }, 300);

    }

}


/* ==========================================
   FULLSCREEN CHANGE
========================================== */

document.addEventListener(
    "fullscreenchange",
    function() {

        if (document.fullscreenElement) {

            console.log(
                "Fullscreen active"
            );

        }

    }
);


/* ==========================================
   START Q1
========================================== */

go(0);


/* ==========================================
   CHECK URL
========================================== */

checkStandaloneMode();

</script>

</body>
</html>
