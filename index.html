<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AFL Mobile Player</title>

<!-- Include HLS library for cross-browser mobile playback (Android & Chrome) -->
<script src="https://jsdelivr.net"></script>

<style>
* {
  box-sizing: border-box;
  -webkit-user-select: none; /* Prevents text selection highlights on mobile */
  user-select: none;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #000;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  overflow: hidden;
}

/* MAIN MOBILE CONTAINER */
#player {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  background: #000;
}

/* VIDEO WINDOW */
#videoWrap {
  position: relative;
  width: 100%;
  flex: 1;
  min-height: 0;
  background: #000;
}

#vid {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}

/* MOBILE NAV BAR */
#bar {
  display: flex;
  width: 100%;
  height: 60px; /* Slightly taller for mobile thumb targets */
  background: #111;
  flex-shrink: 0;
  border-top: 1px solid #222;
  padding-bottom: env(safe-area-inset-bottom); /* iOS home bar protection */
}

#bar button {
  border: 0;
  margin: 0;
  padding: 0;
  background: #161616;
  color: #8e8e93;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  flex: 1;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  transition: background 0.1s ease, color 0.1s ease;
}

#bar button:active {
  background: #2c2c2e;
}

/* ACTIVE QUARTER STATE */
#bar button.active {
  background: #007aff; /* Apple standard system blue */
  color: #fff;
}

/* FULLSCREEN OVERRIDES */
#player:fullscreen {
  width: 100vw;
  height: 100vh;
}
#player:-webkit-full-screen {
  width: 100vw;
  height: 100vh;
}

/* LANDSCAPE ORIENTATION CONFIGURATION */
@media (orientation: landscape) {
  #bar {
    height: 48px;
  }
  #bar button {
    font-size: 14px;
  }
}
</style>
</head>
<body>

<div id="player">

  <!-- VIDEO WRAPPER -->
  <div id="videoWrap">
    <!-- playsinline stops iOS from automatically taking over the screen natively -->
    <video
      id="vid"
      controls
      playsinline
      webkit-playsinline
      preload="metadata">
    </video>
  </div>

  <!-- BOTTOM QUARTER SWITCHER -->
  <div id="bar">
    <button class="quarter active" id="b0" onclick="go(0)">Q1</button>
    <button class="quarter" id="b1" onclick="go(1)">Q2</button>
    <button class="quarter" id="b2" onclick="go(2)">Q3</button>
    <button class="quarter" id="b3" onclick="go(3)">Q4</button>
  </div>

</div>

<script>
/* =========================================
   STREAM DATA SOURCES
   ========================================= */
const streams = [
  "https://akamaized.net",
  "https://akamaized.net",
  "https://akamaized.net",
  "https://akamaized.net"
];

let hls = null;
const video = document.getElementById("vid");
const playerContainer = document.getElementById("player");

/* =========================================
   MOBILE HLS ENGINE LOADER
   ========================================= */
function loadStream(url, autoPlay = false) {
  if (Hls.isSupported()) {
    if (hls) hls.destroy();
    hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, function() {
      if (autoPlay) video.play();
    });
  } 
  else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = url;
    video.addEventListener('loadedmetadata', function() {
      if (autoPlay) video.play();
    });
  }
}

// Initialise Q1
loadStream(streams, false);

/* =========================================
   CHANGE QUARTER
   ========================================= */
function go(num) {
  const wasPlaying = !video.paused;
  loadStream(streams[num], wasPlaying);

  for (let i = 0; i < 4; i++) {
    const button = document.getElementById("b" + i);
    if (i === num) {
      button.classList.add("active");
    } else {
      button.classList.remove("active");
    }
  }
}

/* =========================================
   GESTURE CONTROLLER: FULLSCREEN TOGGLE
   ========================================= */
async function toggleFullscreen() {
  const fullscreenActive = document.fullscreenElement || document.webkitFullscreenElement || document.webkitIsFullScreen;

  if (fullscreenActive) {
    try {
      if (document.exitFullscreen) {
        await document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }
    } catch (error) {
      console.log("Exit fullscreen failed:", error);
    }
    return;
  }

  try {
    if (playerContainer.requestFullscreen) {
      await playerContainer.requestFullscreen({ navigationUI: "hide" });
    } else if (playerContainer.webkitRequestFullscreen) {
      playerContainer.webkitRequestFullscreen();
    } else {
      if (video.webkitEnterFullscreen) {
        video.webkitEnterFullscreen();
      } else {
        alert("Fullscreen is not supported on this device.");
      }
    }
  } catch (error) {
    console.log("Fullscreen entry failed:", error);
  }
}

/* =========================================
   MOBILE DOUBLE-TAP GESTURE CAPTURE
   ========================================= */
let lastTap = 0;
video.addEventListener('touchend', function (e) {
  const currentTime = new Date().getTime();
  const tapLength = currentTime - lastTap;
  
  if (tapLength < 300 && tapLength > 0) {
    e.preventDefault(); // Stop native browser scaling zooms
    toggleFullscreen();
  }
  lastTap = currentTime;
});
</script>

</body>
</html>
