<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               viewport-fit=cover">

<title>AFL Video Player</title>

<!-- Include HLS library for cross-browser playback (Chrome, Edge, Firefox, Android) -->
<script src="https://jsdelivr.net"></script>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #000;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

/* MAIN PLAYER container */
#player {
  position: relative;
  width: 100%;
  height: 100%;
  background: #000;
  display: flex;
  flex-direction: column;
}

/* VIDEO WRAPPER */
#videoWrap {
  position: relative;
  width: 100%;
  flex: 1;
  background: #000;
  min-height: 0;
}

#vid {
  display: block;
  width: 100%;
  height: 100%;
  background: #000;
  object-fit: contain;
}

/* OVERLAY FULLSCREEN BUTTON (Top Right Corner) */
#overlayFsBtn {
  position: absolute;
  top: 15px;
  right: 15px;
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.6);
  color: #fff;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
  transition: opacity 0.3s ease, background 0.2s ease;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

#overlayFsBtn:hover {
  background: rgba(0, 115, 230, 0.9);
}

/* Class to fade out control overlay when user is inactive */
.user-inactive {
  opacity: 0 !important;
  pointer-events: none;
}

/* QUARTER BUTTON BAR */
#bar {
  display: flex;
  width: 100%;
  height: 54px;
  background: #111;
  flex-shrink: 0;
  border-top: 1px solid #222;
}

#bar button {
  border: 0;
  margin: 0;
  padding: 0;
  background: #1a1a1a;
  color: #aaa;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  transition: background 0.2s ease, color 0.2s ease;
}

/* QUARTER BUTTONS */
.quarter {
  flex: 1;
  border-right: 1px solid #111;
}

.quarter:last-child {
  border-right: 0;
}

.quarter.active {
  background: #0073e6;
  color: #fff;
}

/* TRUE FULLSCREEN SYSTEM OVERRIDES */
#player:fullscreen {
  width: 100vw;
  height: 100vh;
}
#player:-webkit-full-screen {
  width: 100vw;
  height: 100vh;
}

/* Hide cursor in fullscreen when inactive */
#player.user-inactive {
  cursor: none;
}

/* LANDSCAPE PHONE ADJUSTMENTS */
@media (orientation: landscape) and (max-height: 500px) {
  #bar {
    height: 44px;
  }
  #bar button {
    font-size: 14px;
  }
  #overlayFsBtn {
    top: 10px;
    right: 10px;
    width: 38px;
    height: 38px;
    font-size: 16px;
  }
}
</style>
</head>

<body>

<div id="player">

  <!-- VIDEO AREA -->
  <div id="videoWrap" id="vContainer">
    
    <!-- Floating Fullscreen Button -->
    <button id="overlayFsBtn" onclick="toggleFullscreen()" title="Toggle Fullscreen">⛶</button>

    <video
      id="vid"
      controls
      playsinline
      webkit-playsinline
      preload="metadata">
    </video>
  </div>

  <!-- BOTTOM NAVIGATION BAR -->
  <div id="bar">
    <button class="quarter active" id="b0" onclick="go(0)">Q1</button>
    <button class="quarter" id="b1" onclick="go(1)">Q2</button>
    <button class="quarter" id="b2" onclick="go(2)">Q3</button>
    <button class="quarter" id="b3" onclick="go(3)">Q4</button>
  </div>

</div>

<script>
/* =========================================
   VIDEO STREAMS
   ========================================= */
const streams = [
  "https://akamaized.net",
  "https://akamaized.net",
  "https://akamaized.net",
  "https://akamaized.net"
];

let hls = null;
const video = document.getElementById("vid");
const playerContainer = document.getElementById("player");
const overlayFsBtn = document.getElementById("overlayFsBtn");

/* =========================================
   STREAM ENGINE LOADER
   ========================================= */
function loadStream(url, autoPlay = false) {
  if (Hls.isSupported()) {
    if (hls) {
      hls.destroy();
    }
    hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, function() {
      if (autoPlay) video.play();
    });
  } 
  else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = url;
    video.addEventListener('loadedmetadata', function() {
      if (autoPlay) video.play();
    });
  }
}

// Start playing the match Q1 structure initially
loadStream(streams[0], false);

/* =========================================
   CHANGE QUARTER
   ========================================= */
function go(num) {
  const wasPlaying = !video.paused;
  loadStream(streams[num], wasPlaying);

  for (let i = 0; i < 4; i++) {
    const button = document.getElementById("b" + i);
    if (i === num) {
      button.classList.add("active");
    } else {
      button.classList.remove("active");
    }
  }
}

/* =========================================
   SMART FULLSCREEN API IMPLEMENTATION
   ========================================= */
async function toggleFullscreen() {
  const fullscreenActive = document.fullscreenElement || document.webkitFullscreenElement;

  if (fullscreenActive) {
    try {
      if (document.exitFullscreen) {
        await document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }
    } catch (error) {
      console.log("Could not exit fullscreen:", error);
    }
    return;
  }

  try {
    if (playerContainer.requestFullscreen) {
      await playerContainer.requestFullscreen({ navigationUI: "hide" });
    } else if (playerContainer.webkitRequestFullscreen) {
      playerContainer.webkitRequestFullscreen();
    } else {
      if (video.webkitEnterFullscreen) {
        video.webkitEnterFullscreen();
      } else {
        alert("Fullscreen is not supported on this device browser.");
      }
    }
  } catch (error) {
    console.log("Fullscreen activation failed:", error);
  }
}

function updateFullscreenButton() {
  const isFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement);
  if (isFullscreen) {
    overlayFsBtn.textContent = "✕";
    overlayFsBtn.title = "Exit Fullscreen";
  } else {
    overlayFsBtn.textContent = "⛶";
    overlayFsBtn.title = "Fullscreen";
  }
}

document.addEventListener("fullscreenchange", updateFullscreenButton);
document.addEventListener("webkitfullscreenchange", updateFullscreenButton);

/* =========================================
   INTELLIGENT UI FADE FUNCTION (Hides button when watching)
   ========================================= */
let fadeTimeout;
function resetUiFadeTimer() {
  // Reveal button and cursor instantly
  overlayFsBtn.classList.remove("user-inactive");
  playerContainer.classList.remove("user-inactive");
  
  clearTimeout(fadeTimeout);
  
  // Hide after 2 seconds of no movement
  fadeTimeout = setTimeout(() => {
    if (!video.paused) { // Only hide elements if video is playing
      overlayFsBtn.classList.add("user-inactive");
      playerContainer.classList.add("user-inactive");
    }
  }, 2000);
}

// Event hooks to track user activity zones
playerContainer.addEventListener("mousemove", resetUiFadeTimer);
playerContainer.addEventListener("touchstart", resetUiFadeTimer);
video.addEventListener("play", resetUiFadeTimer);
video.addEventListener("pause", () => {
  overlayFsBtn.classList.remove("user-inactive");
  playerContainer.classList.remove("user-inactive");
});
</script>

</body>
</html>
