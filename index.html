<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AFL Mobile Player</title>

<style>
* {
  box-sizing: border-box;
  -webkit-user-select: none;
  user-select: none;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #000;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  overflow: hidden;
}

/* MAIN MOBILE CONTAINER */
#player {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  background: #000;
}

/* VIDEO WRAPPER / CONTAINER SLOT */
#videoWrap {
  position: relative;
  width: 100%;
  flex: 1;
  min-height: 0;
  background: #111;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

/* LAUNCH CARD INTERFACE */
.launch-card {
  text-align: center;
  background: #1c1c1e;
  border-radius: 16px;
  padding: 30px 20px;
  width: 100%;
  max-width: 320px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  border: 1px solid #2c2c2e;
}

.launch-card h2 {
  color: #fff;
  margin: 0 0 10px 0;
  font-size: 20px;
  font-weight: 700;
}

.launch-card p {
  color: #8e8e93;
  font-size: 14px;
  margin: 0 0 25px 0;
  line-height: 1.4;
}

/* ACTION BUTTON */
#launchBtn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: #ff3b30; /* YouTube Red color */
  color: #fff;
  text-decoration: none;
  font-size: 16px;
  font-weight: 700;
  padding: 14px 24px;
  border-radius: 12px;
  width: 100%;
  transition: transform 0.1s ease, background-color 0.2s ease;
  -webkit-tap-highlight-color: transparent;
}

#launchBtn:active {
  transform: scale(0.97);
  background-color: #e02e24;
}

/* MOBILE NAV BAR */
#bar {
  display: flex;
  width: 100%;
  height: 60px; 
  background: #111;
  flex-shrink: 0;
  border-top: 1px solid #222;
  padding-bottom: env(safe-area-inset-bottom);
}

#bar button {
  border: 0;
  margin: 0;
  padding: 0;
  background: #161616;
  color: #8e8e93;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  flex: 1;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  transition: background 0.1s ease, color 0.1s ease;
}

#bar button:active {
  background: #2c2c2e;
}

/* ACTIVE QUARTER STATE */
#bar button.active {
  background: #007aff;
  color: #fff;
}

/* LANDSCAPE ORIENTATION CONFIGURATION */
@media (orientation: landscape) {
  #bar {
    height: 48px;
  }
  #bar button {
    font-size: 14px;
  }
  #videoWrap {
    padding: 10px;
  }
  .launch-card {
    padding: 15px 20px;
    max-width: 400px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    text-align: left;
  }
  .launch-card h2, .launch-card p {
    margin-bottom: 0;
  }
  #launchBtn {
    width: auto;
    margin-left: 20px;
  }
}
</style>
</head>
<body>

<div id="player">

  <!-- VIDEO WRAPPER INTERFACE SLOT -->
  <div id="videoWrap">
    <div class="launch-card">
      <div>
        <h2 id="quarterTitle">Quarter 1</h2>
        <p>AFL Grand Final 2021<br>Demons v Bulldogs</p>
      </div>
      <a id="launchBtn" href="https://youtu.be" target="_blank">▶ Watch Stream</a>
    </div>
  </div>

  <!-- BOTTOM QUARTER SWITCHER -->
  <div id="bar">
    <button class="quarter active" id="b0" onclick="go(0)">Q1</button>
    <button class="quarter" id="b1" onclick="go(1)">Q2</button>
    <button class="quarter" id="b2" onclick="go(2)">Q3</button>
    <button class="quarter" id="b3" onclick="go(3)">Q4</button>
  </div>

</div>

<script>
/* ========================================================
   YOUTUBE BASE LINKS (Your 4 Exact Match Video URLs)
   ======================================================== */
const streams = [
  "https://youtu.be", // Q1 Link
  "https://youtu.be", // Q2 Link
  "https://youtu.be", // Q3 Link
  "https://youtu.be"  // Q4 Link
];

const launchBtn = document.getElementById("launchBtn");
const quarterTitle = document.getElementById("quarterTitle");

/* ========================================================
   SWITCH QUARTER PATHS Dynamically
   ======================================================== */
function go(num) {
  // Update the destination hyperlink to update instantly for your tap
  launchBtn.href = streams[num];
  
  // Update UI Card Text display context
  quarterTitle.textContent = "Quarter " + (num + 1);

  // Update button active highlighting states
  for (let i = 0; i < 4; i++) {
    const button = document.getElementById("b" + i);
    if (i === num) {
      button.classList.add("active");
    } else {
      button.classList.remove("active");
    }
  }
}
</script>

</body>
</html>
