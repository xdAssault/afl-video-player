<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>AFL Video Player</title>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background: #000;
        font-family: Arial, sans-serif;
        overflow-x: hidden;
    }

    body {
        display: flex;
        justify-content: center;
    }

    #player {
        width: 100%;
        max-width: 1000px;
        background: #000;
        color: white;
    }

    #videoWrap {
        position: relative;
        width: 100%;
        background: #000;
    }

    video {
        display: block;
        width: 100%;
        height: auto;
        min-height: 200px;
        background: #000;
        object-fit: contain;
    }

    #controls {
        display: flex;
        gap: 8px;
        padding: 10px;
        background: #111;
        flex-wrap: wrap;
    }

    button {
        border: 0;
        border-radius: 8px;
        padding: 11px 16px;
        background: #292929;
        color: white;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
    }

    button:active {
        transform: scale(0.96);
    }

    button.active {
        background: #e31b23;
    }

    #fullscreenBtn {
        margin-left: auto;
        background: #333;
        font-size: 20px;
        padding: 7px 14px;
    }

    #message {
        padding: 8px 12px;
        background: #111;
        color: #aaa;
        font-size: 12px;
        text-align: center;
    }

    /* REAL FULLSCREEN */
    #player:fullscreen,
    #player:-webkit-full-screen {
        width: 100vw;
        height: 100vh;
        max-width: none;
        background: #000;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    #player:fullscreen #videoWrap,
    #player:-webkit-full-screen #videoWrap {
        width: 100vw;
        height: 100vh;
    }

    #player:fullscreen video,
    #player:-webkit-full-screen video {
        width: 100vw;
        height: 100vh;
        object-fit: contain;
    }

    #player:fullscreen #controls,
    #player:-webkit-full-screen #controls {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 10;
        opacity: 0.9;
    }

    #player:fullscreen #message,
    #player:-webkit-full-screen #message {
        display: none;
    }

    /* Mobile fullscreen layout */
    @media (max-width: 600px) {
        button {
            padding: 10px 13px;
            font-size: 14px;
        }

        #controls {
            gap: 6px;
            padding: 8px;
        }

        #fullscreenBtn {
            font-size: 19px;
        }
    }
</style>
</head>

<body>

<div id="player">

    <div id="videoWrap">

        <video
            id="vid"
            controls
            playsinline
            webkit-playsinline
            preload="metadata">
        </video>

    </div>

    <div id="controls">

        <button id="q1" onclick="go(0)">Q1</button>
        <button id="q2" onclick="go(1)">Q2</button>
        <button id="q3" onclick="go(2)">Q3</button>
        <button id="q4" onclick="go(3)">Q4</button>

        <button id="fullscreenBtn" onclick="fullscreenPlayer()">⛶</button>

    </div>

    <div id="message">
        Tap ⛶ for fullscreen
    </div>

</div>

<script>

const streams = [

    // Q1
    "https://afl-vod-multi-005-uptls.akamaized.net/packaging3_f7d8f/out/v1/f552906434954ad5bdadf12380d35c4e/ef1d806899ce413791eb3795aa40401b/b4a356d5797943a38e2db18bf7d1a781/7041471b658e4b4780b70781edde0e32/dc70ac4f15c64664acf501ef0c2c4681/index_2.m3u8",

    // Q2
    "https://afl-vod-multi-005-uptls.akamaized.net/packaging3_f7d8f/out/v1/07c89172716f42c8bda3f6f8ee150e10/ef1d806899ce413791eb3795aa40401b/b4a356d5797943a38e2db18bf7d1a781/713c3a8b292c4c4088a27a3f38948e93/dc70ac4f15c64664acf501ef0c2c4681/index_2.m3u8",

    // Q3
    "https://afl-vod-multi-005-uptls.akamaized.net/packaging3_f7d8f/out/v1/63dfc643ac1d40878097e73abf1d6734/ef1d806899ce413791eb3795aa40401b/b4a356d5797943a38e2db18bf7d1a781/25cd9021cb0e4d0a8ffbc4ee405ac4db/dc70ac4f15c64664acf501ef0c2c4681/index_2.m3u8",

    // Q4
    "https://afl-vod-multi-005-uptls.akamaized.net/packaging3_f7d8f/out/v1/642654a2922a4f1e82b478f8a082d3d1/ef1d806899ce413791eb3795aa40401b/b4a356d5797943a38e2db18bf7d1a781/177f893fee0140069a51c33c82a328ea/dc70ac4f15c64664acf501ef0c2c4681/index_2.m3u8"

];

const video = document.getElementById("vid");
const player = document.getElementById("player");
const message = document.getElementById("message");

let currentQuarter = 0;


/* =========================
   CHANGE QUARTER
========================= */

function go(index) {

    currentQuarter = index;

    video.pause();

    video.src = streams[index];

    video.load();

    updateButtons(index);

    video.play().catch(() => {
        // Some browsers require the user to press Play.
    });
}


/* =========================
   BUTTON HIGHLIGHT
========================= */

function updateButtons(index) {

    for (let i = 1; i <= 4; i++) {
        document
            .getElementById("q" + i)
            .classList.remove("active");
    }

    document
        .getElementById("q" + (index + 1))
        .classList.add("active");
}


/* =========================
   FULLSCREEN
========================= */

async function fullscreenPlayer() {

    /*
       METHOD 1:
       Try normal Fullscreen API.
    */

    try {

        if (document.fullscreenElement) {

            await document.exitFullscreen();
            return;

        }

        if (player.requestFullscreen) {

            await player.requestFullscreen({
                navigationUI: "hide"
            });

            message.textContent = "Fullscreen enabled";
            return;
        }

    } catch (error) {

        console.log("Standard fullscreen blocked:", error);

    }


    /*
       METHOD 2:
       iPhone / Safari / WebKit
    */

    try {

        if (player.webkitRequestFullscreen) {

            player.webkitRequestFullscreen();
            return;
        }

    } catch (error) {

        console.log("WebKit fullscreen blocked:", error);

    }


    /*
       METHOD 3:
       Try fullscreen directly on the video.
    */

    try {

        if (video.webkitEnterFullscreen) {

            video.webkitEnterFullscreen();
            return;
        }

    } catch (error) {

        console.log("Video fullscreen blocked:", error);

    }


    /*
       METHOD 4:
       Google Sites iframe fallback.

       If Google Sites refuses fullscreen, open this
       GitHub Pages player as a standalone webpage.
    */

    openStandalonePlayer();
}


/* =========================
   STANDALONE FALLBACK
========================= */

function openStandalonePlayer() {

    /*
       If the page is already standalone,
       don't keep opening new tabs.
    */

    if (window.top === window.self) {

        message.textContent =
            "Your browser does not allow fullscreen.";

        return;
    }


    /*
       Open the GitHub Pages page outside
       the Google Sites iframe.
    */

    const url = window.location.href;

    const newWindow = window.open(
        url,
        "_blank"
    );


    /*
       If popup/new tab was blocked,
       try navigating the current frame.
    */

    if (!newWindow) {

        message.textContent =
            "Tap the browser menu and open this page directly.";

    }

}


/* =========================
   FULLSCREEN CHANGE
========================= */

document.addEventListener(
    "fullscreenchange",
    function() {

        if (document.fullscreenElement) {

            message.textContent =
                "Fullscreen enabled";

        } else {

            message.textContent =
                "Tap ⛶ for fullscreen";

        }

    }
);


/* =========================
   INITIAL VIDEO
========================= */

go(0);

</script>

</body>
</html>
